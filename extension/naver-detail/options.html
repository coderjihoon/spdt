<!doctype html><html lang="ko"><meta charset="utf-8"><title>상페닥터 수집 설정</title><body><h1>운영자 Chrome 수집 설정</h1><p>서버 주소와 NAVER_WORKER_TOKEN 값을 입력하세요. Chrome을 실행하고 네이버 로그인을 유지해야 자동 수집됩니다.</p><form id="form"><label>서버 주소 <input id="baseUrl" type="url" required placeholder="https://example.com"></label><label>작업 토큰 <input id="workerToken" type="password" required minlength="32"></label><button>저장</button></form><p id="status"></p><script src="options.js"></script></body></html>
